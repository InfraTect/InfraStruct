plugins {
    id 'java-library'
    id 'com.diffplug.spotless' version '6.25.0'   // 포맷터
    id 'com.github.spotbugs' version '6.0.26'     // 린터 (버그 탐지)
    id 'checkstyle'                                // 린터 (코드 스타일/관례)
    id 'jacoco'                                    // 커버리지
}

// 배포 좌표 (실제 배포는 나중. 지금은 값만 정해둔다.)
group = 'com.infratect'
version = '0.1.0'

repositories {
    mavenCentral()
}

java {
    // 로컬 JDK 개수와 무관하게 JDK 21 을 자동 인식/다운로드.
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // 더 최신 JDK 로 빌드하더라도 21 이후 API 를 실수로 못 쓰게 막는다 → 소비자는 21 에서 동작.
    options.release = 21
}

dependencies {
    // 클래스패스 스캔 (스프링 컴포넌트 스캔과 같은 역할).
    api 'io.github.classgraph:classgraph:4.8.179'
    // 상태 직렬화용 JSON.
    implementation 'com.google.code.gson:gson:2.11.0'

    // SpotBugs 억제용 어노테이션(@SuppressFBWarnings). CLASS 리텐션이라 런타임엔 불필요 →
    // compileOnly. SpotBugs 버전과 맞춘다.
    compileOnly 'com.github.spotbugs:spotbugs-annotations:4.8.6'

    // 테스트
    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core:3.26.3'
    testImplementation 'org.mockito:mockito-core:5.14.2'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.14.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// 포맷터: ./gradlew spotlessApply (자동 수정) / spotlessCheck (검증)
spotless {
    java {
        target 'src/**/*.java'
        // google-java-format 의 AOSP 변형 → 들여쓰기 4-space (현행 .editorconfig 관례 유지).
        googleJavaFormat('1.22.0').aosp()
        removeUnusedImports()
        formatAnnotations()
    }
}

// 린터: SpotBugs — 컴파일된 바이트코드에서 버그 패턴을 찾는다.
// spotbugsMain 태스크가 만들어지고, check/build 에 자동으로 포함된다.
// 실행: ./gradlew spotbugsMain  (리포트: build/reports/spotbugs/main.html)
spotbugs {
    toolVersion = '4.8.6'
    // 예외 목록도 룰셋과 같이 레포 루트에 둔다 → 모듈이 늘어나도 같은 규칙을 공유한다.
    excludeFilter = rootProject.layout.projectDirectory.file('config/spotbugs/exclude.xml').asFile
}

tasks.named('spotbugsMain') {
    reports {
        html {
            required = true    // 사람이 읽기 좋은 HTML 리포트
        }
        xml {
            required = false
        }
    }
}

// 린터: Checkstyle — 소스코드에서 스타일/관례 위반을 찾는다. (SpotBugs 는 바이트코드의 '버그', 이쪽은 '관례')
// checkstyleMain / checkstyleTest 태스크가 만들어지고, check/build 에 자동으로 포함된다.
// 실행: ./gradlew checkstyleMain  (리포트: build/reports/checkstyle/main.html)
checkstyle {
    toolVersion = '10.20.1'
    // 룰셋은 레포 루트에 둔다 → 모듈이 늘어나도 같은 규칙을 공유한다.
    configDirectory = rootProject.layout.projectDirectory.dir('config/checkstyle')
    // 경고도 실패로 취급. 룰셋의 severity 가 error 라 사실상 보험이지만, 규칙을 하나씩 완화하다
    // "경고만 잔뜩 쌓이고 아무도 안 보는" 상태로 흘러가는 걸 막는다.
    maxWarnings = 0
}

tasks.withType(Checkstyle).configureEach {
    reports {
        html.required = true    // 사람이 읽기 좋은 HTML 리포트
        xml.required = false
    }
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        exceptionFormat = 'full'
    }
    finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
}
